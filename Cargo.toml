[package]
name = "bitman"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Native GPUI image processing and print workspace"

[dependencies]
# macOS uses Metal; keep its shaders embedded for runtime compilation.
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["wayland", "x11"] }

[target.'cfg(target_os = "windows")'.dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["windows-manifest"] }

# Keep numerical kernels fast during interactive development without rebuilding GPUI.
[profile.dev.package.bitman]
opt-level = 2

# Optimize across crate boundaries without depending on the build machine's CPU.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
