[package]
name = "bitman"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Native GPUI image processing and print workspace"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
tiny-skia = "0.11.4"
# macOS uses Metal; keep its shaders embedded for runtime compilation.
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
semver = "1"
self_update = { version = "1.3.3", default-features = false, features = ["github", "ureq", "rustls", "checksums", "compression-zip-deflate", "compression-tar-gz"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["wayland", "x11"] }
# GPUI -> zed-async-tar -> xattr 0.2 uses ENOATTR, removed on Linux in libc 0.2.190.
# Remove this compatibility constraint when GPUI replaces that xattr dependency.
libc = "=0.2.189"

[target.'cfg(target_os = "windows")'.dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["windows-manifest"] }

# Keep numerical kernels fast during interactive development without rebuilding GPUI.
[profile.dev.package.bitman]
opt-level = 2

# Optimize across crate boundaries without depending on the build machine's CPU.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
